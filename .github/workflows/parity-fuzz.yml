name: parity-fuzz
# The scenario fuzzer (tools/parity_fuzz.py, docs/parity-workflow.md#fuzzing-scenarios) on Blacksmith's runners, started
# by hand only: gh workflow run parity-fuzz.yml --ref <branch> -f family=commands -f seed=1 -f count=200 -f runners=2
# (a wide search), or -f seeds=1017,1325 -f shrink_rounds=4 (those seeds again, one slice each, shrunk).
# The vanilla data is handled as in the hosted parity workflow and by its rules (docs/ci-runners.md#hosted-parity): only a
# commit on a branch of this repository, the fetch and unseal scripts from the default branch's commit, and the steps
# that hold a secret copied from that file line for line (tests/test_ci_parity_fuzz.py compares them). It differs in
# what it leaves out: no event but a hand start, the game built in a job of its own that has no secret, no data and no
# cache, and no cache entry written by any job.
on:
  workflow_dispatch:
    inputs:
      family:
        description: The fuzzer's family
        type: choice
        options: [commands, items, blockdata, persist, spawn, shulker, retype]
        default: commands
      seed:
        description: The first seed
        type: string
        default: '1'
      count:
        description: Seeds per slice (a runner runs 8 slices side by side)
        type: string
        default: '200'
      runners:
        description: 16-vCPU runners, 1 to 8
        type: string
        default: '2'
      seeds:
        description: Or these seeds, comma-separated (at most 64), one slice each; seed, count and runners then do not count
        type: string
        default: ''
      ordinary:
        description: Only what a command or a played world gives (--ordinary)
        type: boolean
        default: true
      shrink_rounds:
        description: Shrink rounds per group, 0 to 6 (0 for a wide search)
        type: string
        default: '0'
concurrency:
  group: parity-fuzz-${{ github.run_id }}
  cancel-in-progress: false
permissions:
  contents: read
env:
  # Test runs never reach the telemetry server: no live-count ping, no uploads (docs/telemetry.md).
  HORIZON_TELEMETRY_URL: "off"

jobs:
  # Which seeds, on how many runners: no secret and no game data here.
  plan:
    name: fuzz plan
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    outputs:
      data: ${{ steps.access.outputs.data }}
      head: ${{ steps.head.outputs.sha }}
      java: ${{ steps.keys.outputs.java }}
      prepare: ${{ steps.keys.outputs.prepare }}
      trusted: ${{ steps.trusted.outputs.sha }}
      sealed: ${{ steps.trusted.outputs.sealed }}
      matrix: ${{ steps.slices.outputs.matrix }}
    steps:
      # The file has one trigger. Checked in the shell too, so a trigger added later runs nothing until this job and
      # its review say what that event may reach.
      - name: Started by hand only
        env:
          EVENT: ${{ github.event_name }}
        run: |
          [ "$EVENT" = workflow_dispatch ] || { echo "::error::parity-fuzz runs on a hand start only"; exit 1; }
      # As hosted parity's plan job, line for line: whether the secrets are set, the default branch's commit whose
      # scripts the fuzz jobs use, and the tested commit, which must be on a branch of this repository.
      - name: Access to the vanilla data
        id: access
        env:
          SET: ${{ secrets.VANILLA_DATA_DEPLOY_KEY != '' && secrets.VANILLA_DATA_PASSPHRASE != '' }}
        run: echo "data=$SET" >> "$GITHUB_OUTPUT"
      - name: The commit of the trusted scripts
        id: trusted
        if: steps.access.outputs.data == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          # The branch by its explicit ref: a tag or another ref of the same name never stands in for it.
          [[ "$DEFAULT" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "::error::bad default branch name"; exit 1; }
          ref="repos/$GITHUB_REPOSITORY/git/ref/heads/$DEFAULT"
          sha=$(gh api "$ref" --jq 'select(.object.type == "commit") | .object.sha')
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::no commit for heads/$DEFAULT"; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/contents/tools/ci/fetch-vanilla-data.sh?ref=$sha" --silent ||
            { echo "::error::no tools/ci/fetch-vanilla-data.sh on $DEFAULT"; exit 1; }
          sealed=true
          if ! gh api "repos/$GITHUB_REPOSITORY/contents/tools/ci/sealed-cache.sh?ref=$sha" --silent 2> /dev/null; then
            sealed=false
            echo "::warning::no tools/ci/sealed-cache.sh on $DEFAULT: no sealed cache this run"
          fi
          { echo "sha=$sha"; echo "sealed=$sealed"; } >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.access.outputs.data == 'true'
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: The commit to test, on a branch of this repository
        id: head
        if: steps.access.outputs.data == 'true'
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          git fetch -q --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
          if [ -z "$(git branch -r --contains "$sha")" ]; then
            echo "::error::$sha is on no branch of $GITHUB_REPOSITORY: hosted parity tests only its own branches' commits"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      # What the fuzz jobs need from the tested tree before they check it out: they fetch and unseal first (no code of
      # the tested commit may run beside the passphrase), and validate these. The preparer's key is vanilla-data.sh's.
      - name: The JDK and the preparer's key, for the fuzz jobs
        id: keys
        if: steps.access.outputs.data == 'true'
        run: |
          set -euo pipefail
          {
            echo "java=$(sed -n 's/.*"java_major": *\([0-9]*\).*/\1/p' research-lock.json | head -1)"
            echo "prepare=$(git ls-files -s crates/horizon-prepare mods/horizon/src/test/java research-lock.json tools/ci/vanilla-data.sh tools/ci/seed_prepared_extras.py tools/prepare_output.py | sha256sum | cut -c1-16)"
          } >> "$GITHUB_OUTPUT"
      # The inputs reach a shell only as variables, and count only in the shapes checked here.
      - name: The slices, by runner
        id: slices
        if: steps.access.outputs.data == 'true'
        env:
          FAMILY: ${{ inputs.family }}
          SEED: ${{ inputs.seed }}
          COUNT: ${{ inputs.count }}
          RUNNERS: ${{ inputs.runners }}
          SEEDS: ${{ inputs.seeds }}
          SHRINK: ${{ inputs.shrink_rounds }}
        run: |
          set -euo pipefail
          case "$FAMILY" in
            commands|items|blockdata|persist|spawn|shulker|retype) ;;
            *) echo "::error::no such family"; exit 1 ;;
          esac
          [[ "$SEED" =~ ^[0-9]{1,8}$ && "$COUNT" =~ ^[1-9][0-9]{0,2}$ && "$RUNNERS" =~ ^[1-8]$ && "$SHRINK" =~ ^[0-6]$ ]] ||
            { echo "::error::seed, count (1 to 400), runners (1 to 8) or shrink_rounds (0 to 6) is not a number in its range"; exit 1; }
          [ "$COUNT" -le 400 ] || { echo "::error::at most 400 seeds a slice"; exit 1; }
          [[ -z "$SEEDS" || "$SEEDS" =~ ^[0-9]{1,8}(,[0-9]{1,8}){0,63}$ ]] ||
            { echo "::error::seeds is not a list of at most 64 numbers"; exit 1; }
          include=""
          if [ -n "$SEEDS" ]; then
            IFS=, read -ra list <<< "$SEEDS"
            of=$(( (${#list[@]} + 7) / 8 ))
            for (( at = 0; at < ${#list[@]}; at += 8 )); do
              chunk=$(IFS=,; echo "${list[*]:at:8}")
              include+="${include:+,}{\"runner\":$(( at / 8 + 1 )),\"of\":$of,\"first\":0,\"seeds\":\"$chunk\"}"
            done
            echo "$FAMILY: ${#list[@]} seeds again, one slice each, on $of runners" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            for runner in $(seq "$RUNNERS"); do
              first=$(( 10#$SEED + (runner - 1) * 8 * COUNT ))
              include+="${include:+,}{\"runner\":$runner,\"of\":$RUNNERS,\"first\":$first,\"seeds\":\"\"}"
            done
            echo "$FAMILY: seeds $(( 10#$SEED )) to $(( 10#$SEED + RUNNERS * 8 * COUNT - 1 )), $COUNT a slice, on $RUNNERS runners" |
              tee -a "$GITHUB_STEP_SUMMARY"
          fi
          echo "matrix={\"include\":[$include]}" >> "$GITHUB_OUTPUT"

  # The game, built once from the tested commit: no secret, no data, no cache. Its build scripts run here, where
  # there is nothing of the maintainers' to read; the fuzz jobs only run what this job uploads, after their last step
  # with a secret.
  build:
    name: fuzz build (no secret, no data)
    needs: plan
    if: needs.plan.outputs.data == 'true'
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 60
    env:
      HORIZON_NO_SCCACHE: "1"
      CARGO_BUILD_JOBS: "16"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.head }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, 2026-11
        with:
          toolchain: stable
      - name: Build packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends pkg-config libasound2-dev libudev-dev > /dev/null
      # The harnesses' own selection (tools/fast_bins.py), so the game is the one a harness would build.
      - name: The game, in the fast profile
        run: |
          set -euo pipefail
          mapfile -t build < <(python3 -I -c 'import sys; sys.path.insert(0, "tools"); import fast_bins; print("\n".join(fast_bins.command("horizon-client")))')
          "${build[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: parity-fuzz-game
          path: target/fast/horizon-client
          if-no-files-found: error
          retention-days: 1

  # One runner: the data, then 8 slices of the fuzzer side by side against the built game, on a 16-vCPU runner with
  # no GPU (Xvfb and Mesa's software Vulkan). It reads main's caches (the dataset's encrypted chunks, the sealed
  # prepared resources) and writes none: this job has no save step and no seal step.
  #
  # The steps that hold a secret (fetch, unseal) are hosted parity's run job's, line for line, and trust nothing a
  # cache entry could have written (see that job's comment). They end before the checkout: nothing of the tested
  # commit, and nothing the build job made, runs beside a secret.
  fuzz:
    name: fuzz ${{ matrix.runner }}/${{ matrix.of }}
    needs: [plan, build]
    if: needs.plan.outputs.data == 'true'
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      # No compiler cache: sccache would keep what this job builds where nothing checks it.
      HORIZON_NO_SCCACHE: "1"
      CARGO_BUILD_JOBS: "16"
      DATASET: 26.3-linux-x64
    steps:
      - name: Folders for the data, outside the checkout
        run: |
          {
            echo "HORIZON_SHARED_SOURCE=$RUNNER_TEMP/vanilla/shared-local"
            echo "HORIZON_PREPARED_CACHE=$RUNNER_TEMP/vanilla/prepared"
            echo "PARITY_SHARED=$RUNNER_TEMP/vanilla/parity-shared"
            echo "VANILLA_DATA_CACHE=$RUNNER_TEMP/vanilla-encrypted"
            echo "SEALED=$RUNNER_TEMP/sealed"
            echo "UNSEALED=$RUNNER_TEMP/unsealed"
            # The oracle shim's memo of JDK file hashes, guarded by this machine's stat data (tools/parity_shim.py):
            # never sealed, restored or placed.
            echo "RUNTIME_MEMO=$GITHUB_WORKSPACE/.local/parity-runner/runtime-memo"
            # This run's harness logs: one restored from an earlier run would read as this run's (a first-run log as
            # an unfinished retry).
            echo "PARITY_LOGS=$GITHUB_WORKSPACE/.local/parity-runner/logs"
          } >> "$GITHUB_ENV"
      # Before the checkout: the keys below may only come from what the tested commit cannot run.
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: ${{ needs.plan.outputs.java }}
      # Only for the preparer, when the sealed prepared resources were not restored (tools/ci/vanilla-data.sh).
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, 2026-11
        with:
          toolchain: stable
      # The plan job's values come from the tested tree: checked before they name anything.
      - name: Cache keys
        id: keys
        env:
          JAVA_MAJOR: ${{ needs.plan.outputs.java }}
          PREPARE: ${{ needs.plan.outputs.prepare }}
        run: |
          set -euo pipefail
          [[ "$JAVA_MAJOR" =~ ^[0-9]+$ && "$PREPARE" =~ ^[0-9a-f]{16}$ ]] ||
            { echo "::error::the plan's keys are not what it computes"; exit 1; }
          echo "prepare=$PREPARE" >> "$GITHUB_OUTPUT"
      - name: Restore the encrypted dataset
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.VANILLA_DATA_CACHE }}
          key: parity-dataset-v1-${{ env.DATASET }}-newest
          restore-keys: parity-dataset-v1-${{ env.DATASET }}-
      # The only step with the deploy key (hosted parity's, line for line).
      - name: Fetch the vanilla data
        id: fetch
        shell: /usr/bin/bash --noprofile --norc -e -o pipefail {0}
        env:
          VANILLA_DATA_DEPLOY_KEY: ${{ secrets.VANILLA_DATA_DEPLOY_KEY }}
          VANILLA_DATA_PASSPHRASE: ${{ secrets.VANILLA_DATA_PASSPHRASE }}
          GH_TOKEN: ${{ github.token }}
          TRUSTED_SHA: ${{ needs.plan.outputs.trusted }}
          BASH_ENV: ''
          ENV: ''
        run: |
          # The trusted script in a fixed environment (see the run job's comment).
          export PATH=/usr/bin:/bin
          unset BASH_ENV ENV CDPATH
          if [ -w /usr/bin ] || [ -w /bin ]; then echo "::error::/usr/bin is writable: no step with a secret"; exit 1; fi
          [[ "$TRUSTED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::no trusted commit"; exit 1; }
          private=$(mktemp -d /tmp/trusted.XXXXXXXX)
          trap 'rm -rf "$private"' EXIT
          mkdir "$private/home"
          api() {  # api ACCEPT PATH FILE; the token goes on stdin, never on a command line
            printf 'header = "Authorization: Bearer %s"\n' "$GH_TOKEN" |
              env -i HOME="$private/home" PATH=/usr/bin:/bin curl -q -fsS --proto =https --retry 3 --max-time 120 -K - \
                -H "Accept: $1" -o "$3" "https://api.github.com/repos/$GITHUB_REPOSITORY/$2"
          }
          # verified FILE ID: FILE is not empty and its git blob id, sha1 of "blob <length>\0" and its bytes, is ID.
          verified() {
            [[ "$2" =~ ^[0-9a-f]{40}$ ]] && [ -s "$1" ] &&
              [ "$({ printf 'blob %d\0' "$(stat -c %s "$1")"; cat "$1"; } | sha1sum | cut -c1-40)" = "$2" ]
          }
          # fetched NAME: tools/ci/NAME at the trusted commit into the private folder, its bytes checked against the
          # blob id the API names for that path at that commit, asked for separately.
          fetched() {
            api application/vnd.github+json "contents/tools/ci/$1?ref=$TRUSTED_SHA" "$private/$1.json" &&
              api application/vnd.github.raw "contents/tools/ci/$1?ref=$TRUSTED_SHA" "$private/$1" &&
              verified "$private/$1" "$(python3 -I -c 'import json, sys; print(json.load(open(sys.argv[1]))["sha"])' \
                "$private/$1.json" 2> /dev/null)"
          }
          isolated() {
            local secrets=$1 name extra=()
            shift
            while [ "$1" != -- ]; do extra+=("$1"); shift; done
            shift
            for name in $secrets; do printf '%s\0' "${!name}"; done |
              env -i PATH=/usr/bin:/bin HOME="$private/home" GITHUB_WORKSPACE="$GITHUB_WORKSPACE" RUNNER_TEMP="$RUNNER_TEMP" \
                GITHUB_OUTPUT="$GITHUB_OUTPUT" "${extra[@]}" bash --noprofile --norc -c \
                'for name in $1; do IFS= read -r -d "" "$name"; export "$name"; done; shift; exec bash --noprofile --norc "$@"' \
                isolated "$secrets" "$@"
          }
          fetched fetch-vanilla-data.sh || {
            echo "::error::tools/ci/fetch-vanilla-data.sh at $TRUSTED_SHA did not download, or is not the blob the API" \
              "names: no data, the shard stops"
            exit 1
          }
          isolated "VANILLA_DATA_DEPLOY_KEY VANILLA_DATA_PASSPHRASE" VANILLA_DATA_CACHE="$VANILLA_DATA_CACHE" -- \
            "$private/fetch-vanilla-data.sh" "$HORIZON_SHARED_SOURCE" "$DATASET"
      # The one sealed entry this job reads, named as hosted parity names it.
      - name: Key of the sealed prepared resources
        id: entries
        if: needs.plan.outputs.sealed == 'true' && steps.fetch.outputs.digest != ''
        env:
          DIGEST: ${{ steps.fetch.outputs.digest }}
          PREPARE: ${{ steps.keys.outputs.prepare }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^[0-9a-f]{16}$ ]] || { echo "::error::bad digest"; exit 1; }
          echo "prepared=parity-prepared-v2-$PREPARE-$DIGEST" >> "$GITHUB_OUTPUT"
      - name: Restore the prepared resources (sealed)
        id: prepared
        if: steps.entries.outcome == 'success'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.SEALED }}/prepared
          key: ${{ steps.entries.outputs.prepared }}
      # The passphrase's second and last step here (hosted parity's, line for line, for the one entry).
      - name: Unseal the restored caches
        if: steps.entries.outcome == 'success'
        shell: /usr/bin/bash --noprofile --norc -e -o pipefail {0}
        env:
          VANILLA_DATA_PASSPHRASE: ${{ secrets.VANILLA_DATA_PASSPHRASE }}
          GH_TOKEN: ${{ github.token }}
          TRUSTED_SHA: ${{ needs.plan.outputs.trusted }}
          BASH_ENV: ''
          ENV: ''
          PREPARED: ${{ steps.entries.outputs.prepared }}
        run: |
          # The trusted script in a fixed environment (see the run job's comment).
          export PATH=/usr/bin:/bin
          unset BASH_ENV ENV CDPATH
          if [ -w /usr/bin ] || [ -w /bin ]; then echo "::error::/usr/bin is writable: no step with a secret"; exit 1; fi
          [[ "$TRUSTED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::no trusted commit"; exit 1; }
          private=$(mktemp -d /tmp/trusted.XXXXXXXX)
          trap 'rm -rf "$private"' EXIT
          mkdir "$private/home"
          api() {  # api ACCEPT PATH FILE; the token goes on stdin, never on a command line
            printf 'header = "Authorization: Bearer %s"\n' "$GH_TOKEN" |
              env -i HOME="$private/home" PATH=/usr/bin:/bin curl -q -fsS --proto =https --retry 3 --max-time 120 -K - \
                -H "Accept: $1" -o "$3" "https://api.github.com/repos/$GITHUB_REPOSITORY/$2"
          }
          # verified FILE ID: FILE is not empty and its git blob id, sha1 of "blob <length>\0" and its bytes, is ID.
          verified() {
            [[ "$2" =~ ^[0-9a-f]{40}$ ]] && [ -s "$1" ] &&
              [ "$({ printf 'blob %d\0' "$(stat -c %s "$1")"; cat "$1"; } | sha1sum | cut -c1-40)" = "$2" ]
          }
          # fetched NAME: tools/ci/NAME at the trusted commit into the private folder, its bytes checked against the
          # blob id the API names for that path at that commit, asked for separately.
          fetched() {
            api application/vnd.github+json "contents/tools/ci/$1?ref=$TRUSTED_SHA" "$private/$1.json" &&
              api application/vnd.github.raw "contents/tools/ci/$1?ref=$TRUSTED_SHA" "$private/$1" &&
              verified "$private/$1" "$(python3 -I -c 'import json, sys; print(json.load(open(sys.argv[1]))["sha"])' \
                "$private/$1.json" 2> /dev/null)"
          }
          isolated() {
            local secrets=$1 name extra=()
            shift
            while [ "$1" != -- ]; do extra+=("$1"); shift; done
            shift
            for name in $secrets; do printf '%s\0' "${!name}"; done |
              env -i PATH=/usr/bin:/bin HOME="$private/home" GITHUB_WORKSPACE="$GITHUB_WORKSPACE" RUNNER_TEMP="$RUNNER_TEMP" \
                GITHUB_OUTPUT="$GITHUB_OUTPUT" "${extra[@]}" bash --noprofile --norc -c \
                'for name in $1; do IFS= read -r -d "" "$name"; export "$name"; done; shift; exec bash --noprofile --norc "$@"' \
                isolated "$secrets" "$@"
          }
          fetched sealed-cache.sh || {
            echo "::warning::tools/ci/sealed-cache.sh at $TRUSTED_SHA did not download, or is not the blob the API" \
              "names: this run starts cold"
            exit 0
          }
          for entry in "prepared $PREPARED"; do
            read -r label key <<< "$entry"
            isolated VANILLA_DATA_PASSPHRASE -- "$private/sealed-cache.sh" unseal "$label" "$key" "$SEALED/$label/archive" \
              --exclude "$RUNTIME_MEMO" --exclude "$PARITY_LOGS" "$UNSEALED/$label"
            rm -rf "${SEALED:?}/$label"
          done
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.head }}
          persist-credentials: false
      - name: The unsealed files into place
        run: |
          python3 - "$UNSEALED" "$GITHUB_WORKSPACE" "$RUNNER_TEMP" <<'EOF'
          import shutil, sys
          from pathlib import Path
          stages, roots = Path(sys.argv[1]), sys.argv[2:]
          def merge(source, target):
              for entry in sorted(source.iterdir()):
                  there = target / entry.name
                  if entry.is_dir() and not entry.is_symlink() and there.is_dir() and not there.is_symlink():
                      merge(entry, there)
                      continue
                  if there.is_symlink() or there.is_file():
                      there.unlink()
                  elif there.exists():
                      shutil.rmtree(there)
                  shutil.move(entry, there)
          for stage in sorted(stages.iterdir()) if stages.is_dir() else []:
              for root in roots:
                  source = stage / root.lstrip("/")
                  if source.is_dir():
                      Path(root).mkdir(parents=True, exist_ok=True)
                      merge(source, Path(root))
          shutil.rmtree(stages, ignore_errors=True)
          EOF
      - name: Build and screen packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends pkg-config libasound2-dev libudev-dev \
            mesa-vulkan-drivers libvulkan1 xvfb x11-utils libx11-6 libxcursor1 libxrandr2 libxi6 libxinerama1 \
            libxkbcommon0 libxkbcommon-x11-0 libgl1 libegl1 > /dev/null
      - name: A virtual screen with software Vulkan
        run: |
          Xvfb :90 -screen 0 1280x720x24 -nolisten tcp > /dev/null 2>&1 &
          for _ in $(seq 100); do xdpyinfo -display :90 > /dev/null 2>&1 && break; sleep 0.1; done
          xdpyinfo -display :90 > /dev/null 2>&1 || { echo "::error::Xvfb did not answer within 10 s"; exit 1; }
          icd=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -1)
          [ -n "$icd" ] || { echo "::error::no lavapipe driver file"; exit 1; }
          { echo "DISPLAY=:90"; echo "VK_DRIVER_FILES=$icd"; } >> "$GITHUB_ENV"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Tools from the runner
        run: bash tools/ci/runner-env.sh
      # For the preparer's build, should the prepared resources not be restored. Fetching runs no build script.
      - name: The crates, before the preparer
        run: cargo fetch --locked
      - name: Vanilla data, and resources prepared by this preparer
        run: bash tools/ci/vanilla-data.sh
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: parity-fuzz-game
          path: ${{ runner.temp }}/game
      # The fixed scenarios that must match, once per run: a fuzzer that cannot compare finds nothing and says so here.
      - name: The fuzzer works (smoke)
        if: matrix.runner == 1
        run: |
          chmod +x "$RUNNER_TEMP/game/horizon-client"
          python3 tools/parity_fuzz.py --smoke --binary "$RUNNER_TEMP/game/horizon-client" \
            --work-dir "$GITHUB_WORKSPACE/.local/parity-fuzz-smoke"
      # A slice that found differences is a result, not a failure; the step fails for a slice that compared nothing.
      - name: The slices
        env:
          FAMILY: ${{ inputs.family }}
          FIRST: ${{ matrix.first }}
          SEEDS: ${{ matrix.seeds }}
          COUNT: ${{ inputs.count }}
          SHRINK: ${{ inputs.shrink_rounds }}
          ORDINARY: ${{ inputs.ordinary }}
        run: |
          chmod +x "$RUNNER_TEMP/game/horizon-client"
          ordinary=()
          if [ "$ORDINARY" = true ]; then ordinary=(--ordinary); fi
          which=(--seed "$FIRST" --count "$COUNT")
          if [ -n "$SEEDS" ]; then which=(--seeds "$SEEDS"); fi
          python3 tools/parity_fuzz_probe.py slices --binary "$RUNNER_TEMP/game/horizon-client" \
            --out "$RUNNER_TEMP/parity-fuzz-results" --family "$FAMILY" "${which[@]}" \
            --shrink-rounds "$SHRINK" "${ordinary[@]}"
      # Each slice's output, found.json and report.json (compared values and commands, as hosted parity's logs),
      # kept 3 days. Nothing else of .local/ or the data leaves the runner.
      - name: Upload the slices' results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: parity-fuzz-results-${{ matrix.runner }}
          path: ${{ runner.temp }}/parity-fuzz-results/
          if-no-files-found: ignore
          retention-days: 3

  # The job to read: every slice's groups as one table of clusters, in its summary and in the parity-fuzz-merged
  # artifact (kept 3 days, as the slices' results: it holds compared values too). It fails when a fuzz job failed
  # (a slice compared nothing) or nothing could be merged.
  summary:
    name: fuzz summary
    needs: [plan, fuzz]
    if: always() && needs.plan.outputs.head != ''
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.head }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          pattern: parity-fuzz-results-*
          path: ${{ runner.temp }}/results
      - name: The slices' groups as one
        env:
          FUZZ: ${{ needs.fuzz.result }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/merged"
          mapfile -d '' found < <(find "$RUNNER_TEMP/results" -name found.json -print0 2> /dev/null | sort -z)
          if [ "${#found[@]}" -eq 0 ]; then
            echo "::error::no slice left a result (the fuzz jobs ended $FUZZ)"
            exit 1
          fi
          python3 tools/parity_fuzz_probe.py merge "${found[@]}" > "$RUNNER_TEMP/merged/merged.txt"
          # Values come from the tested tree and the game: shown as an indented block, no line of it Markdown.
          { echo "The first 200 lines; all of it is in the parity-fuzz-merged artifact."; echo
            head -200 "$RUNNER_TEMP/merged/merged.txt" | cut -c1-300 | sed 's/^/    /'; } >> "$GITHUB_STEP_SUMMARY"
          [ "$FUZZ" = success ] || { echo "::error::the fuzz jobs ended $FUZZ: a slice compared nothing, see its job"; exit 1; }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: parity-fuzz-merged
          path: ${{ runner.temp }}/merged/merged.txt
          if-no-files-found: ignore
          retention-days: 3
